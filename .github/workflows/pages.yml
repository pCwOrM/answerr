name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Exclude archive and server-side files from Pages deployment
        # The website needs only HTML/CSS/JS, assets and policies/; backend code, deploy scripts and internal docs
        # stay in the repository and are not served from answerr.me.
        run: |
          rm -rf archive deploy server tests scripts site commerce docs __pycache__
          rm -f ./*.py ./*.sh ./*.service requirements.txt pyproject.toml package.json

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
