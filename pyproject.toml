[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "answerr"
version = "0.3.0"
description = "Dual-Cognition AI platform bridging Gemini System-2 deliberation with werr Zero-Memory System-1 fractal decision engine."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Business Source License 1.1" }
authors = [
    { name = "Volkan Dağlı", email = "info@itouch.com.tr" }
]
keywords = ["answerr", "werr", "fractal-ai", "gemini", "zero-memory", "mandelbrot", "system-1", "system-2", "dual-cognition"]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
    "numpy>=1.24.0"
]

[project.urls]
Homepage = "https://answerr.me"
Repository = "https://github.com/pCwOrM/answerr"
"werr Base Engine" = "https://github.com/pCwOrM/werr"
"Base Research" = "https://github.com/pCwOrM/mandelbrot-fractal-neural-synthesis"
